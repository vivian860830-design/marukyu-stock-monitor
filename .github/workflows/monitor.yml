name: Marukyu Stock Monitor

on:
  # 手動測試
  workflow_dispatch:

  # 日本時間：
  #
  # 09:00 JST = 00:00 UTC
  # 10:00 JST = 01:00 UTC
  # 11:00 JST = 02:00 UTC
  # 12:00 JST = 03:00 UTC
  # 13:00 JST = 04:00 UTC
  # 14:00 JST = 05:00 UTC
  # 15:00 JST = 06:00 UTC
  # 16:00 JST = 07:00 UTC
  # 17:00 JST = 08:00 UTC
  # 17:30 JST = 08:30 UTC
  #
  # 週一～週五

  schedule:
    - cron: '0 0-8 * * 1-5'
    - cron: '30 8 * * 1-5'


permissions:
  contents: write


jobs:

  monitor:

    name: Check Marukyu Stock

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'


      # ======================================================
      # 3. 安裝 Playwright
      # ======================================================

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium


      # ======================================================
      # 4. 確認 Secrets
      # ======================================================

      - name: Check required secrets
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$GAS_WEBHOOK_URL" ]; then
            echo "ERROR: GAS_WEBHOOK_URL is not configured."
            exit 1
          fi

          if [ -z "$MONITOR_SECRET" ]; then
            echo "ERROR: MONITOR_SECRET is not configured."
            exit 1
          fi

          echo "Required secrets are configured."


      # ======================================================
      # 5. 執行 SKU 級監控
      # ======================================================

      - name: Check Marukyu stock
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          PYTHONUNBUFFERED: '1'
        run: |
          python monitor.py


      # ======================================================
      # 6. 確認 state
      # ======================================================

      - name: Verify stock state
        run: |
          if [ ! -f stock_state.json ]; then
            echo "ERROR: stock_state.json was not created."
            exit 1
          fi

          echo "stock_state.json exists."
          echo ""
          cat stock_state.json


      # ======================================================
      # 7. Commit state
      # ======================================================

      - name: Save stock state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_state.json

          if git diff --cached --quiet; then
            echo "Stock state unchanged."
            echo "No commit required."
            exit 0
          fi

          git commit -m "Update Marukyu SKU stock state"

          git pull --rebase origin "${{ github.ref_name }}"

          git push origin HEAD:"${{ github.ref_name }}"

          echo "Stock state saved successfully."
