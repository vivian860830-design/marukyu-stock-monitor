name: Marukyu authenticated SKU diagnostic (v3, session-reuse experiment)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marukyu-auth-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run diagnostic (guest capture, or reused-session if secret is set)
        env:
          # Optional. Base64-encoded storage_state.json from
          # local/export_storage_state.py. When absent, monitor.py falls
          # back to guest-only capture plus the known-blocked /account
          # evidence probe, same as v1/v2.
          MARUKYU_STORAGE_STATE: ${{ secrets.MARUKYU_STORAGE_STATE }}
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python monitor.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marukyu-auth-diagnostic-v3
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 3
