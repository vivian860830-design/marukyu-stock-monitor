name: Marukyu Kinrin Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  diagnostic:

    name: Diagnose Kinrin

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose Kinrin
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python monitor.py

      - name: Upload diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinrin-debug
          path: kinrin-debug.png
          if-no-files-found: ignore
          retention-days: 3      # 6. 確認 state
      #
      # 如果 monitor.py 因 403 等原因失敗，
      # workflow 會停在上一個 step，
      # 不會執行到這裡。
      # ======================================================

      - name: Verify stock state
        run: |

          if [ ! -f stock_state.json ]; then
            echo "ERROR: stock_state.json does not exist."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "stock_state.json"
          echo "========================================"
          echo ""

          cat stock_state.json


      # ======================================================
      # 7. 儲存 state
      # ======================================================

      - name: Save stock state
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_state.json

          if git diff --cached --quiet; then

            echo "Stock state unchanged."
            echo "No commit required."

            exit 0

          fi

          git commit -m "Update Marukyu SKU stock state"

          git pull --rebase origin "${{ github.ref_name }}"

          git push origin HEAD:"${{ github.ref_name }}"

          echo "Stock state saved successfully."
