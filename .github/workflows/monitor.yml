name: Marukyu authenticated SKU diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marukyu-auth-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Compare guest and authenticated SKU signals
        env:
          MARUKYU_USERNAME: ${{ secrets.MARUKYU_USERNAME }}
          MARUKYU_PASSWORD: ${{ secrets.MARUKYU_PASSWORD }}
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python monitor.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marukyu-auth-diagnostic
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 3
