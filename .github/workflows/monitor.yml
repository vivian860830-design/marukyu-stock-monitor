name: Marukyu matcha stock monitor (v4, 12 products + LINE notify)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log the notification instead of sending it to the GAS webhook)'
        type: boolean
        default: true
  schedule:
    # Every 30 minutes. Adjust as you like; GitHub Actions schedules are
    # best-effort and can run a few minutes late during busy periods.
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: marukyu-stock-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run monitor
        env:
          MARUKYU_STORAGE_STATE: ${{ secrets.MARUKYU_STORAGE_STATE }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          # workflow_dispatch's boolean input arrives as the string "true"/"false".
          # A schedule-triggered run has no inputs at all, so default to a real run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python monitor.py
      - name: Commit updated stock_state.json
        if: always()
        run: |
          if [ -n "$(git status --porcelain stock_state.json)" ]; then
            git config user.name "marukyu-stock-monitor"
            git config user.email "actions@users.noreply.github.com"
            git add stock_state.json
            git commit -m "Update stock_state.json [skip ci]"
            git push
          else
            echo "stock_state.json unchanged, nothing to commit."
          fi
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marukyu-stock-monitor-evidence
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 3
