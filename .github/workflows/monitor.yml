name: Marukyu matcha stock monitor (v5, one job per product)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (log the notification instead of sending it to the GAS webhook)'
        type: boolean
        default: true
  schedule:
    # Every 30 minutes. Each run is 12 independent jobs (one per product)
    # plus one aggregate job; GitHub Actions schedules are best-effort and
    # can run a few minutes late during busy periods.
    - cron: '*/30 * * * *'

jobs:
  capture:
    # One job per product, confirmed necessary 2026-09-15: a single job
    # visiting more than one product page in the same browser session gets
    # Cloudflare-blocked after the first page, regardless of delay between
    # navigations. Separate jobs get separate runner VMs (and, confirmed,
    # separate outbound IPs), and each gets its own "first request" pass.
    strategy:
      fail-fast: false
      matrix:
        slug: [unkaku, choan, eiju, kinrin, chigi-no-shiro, isuzu, aoarashi, kiwami-choan, wako, tenju, yugen, wakatake]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Capture this product
        env:
          MARUKYU_STORAGE_STATE: ${{ secrets.MARUKYU_STORAGE_STATE }}
          PRODUCT_SLUG: ${{ matrix.slug }}
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python capture_one.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-${{ matrix.slug }}
          path: diagnostic-output/${{ matrix.slug }}.json
          if-no-files-found: warn
          retention-days: 3

  aggregate:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all product results
        uses: actions/download-artifact@v4
        with:
          pattern: product-*
          path: product-results
          merge-multiple: true
      - name: Aggregate, diff against stock_state.json, notify if restocked
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          PYTHONUNBUFFERED: '1'
        run: python aggregate.py
      - name: Commit updated stock_state.json
        if: always()
        run: |
          if [ -n "$(git status --porcelain stock_state.json)" ]; then
            git config user.name "marukyu-stock-monitor"
            git config user.email "actions@users.noreply.github.com"
            git add stock_state.json
            git commit -m "Update stock_state.json [skip ci]"
            git push
          else
            echo "stock_state.json unchanged, nothing to commit."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-evidence
          path: diagnostic-output/
          if-no-files-found: ignore
          retention-days: 3
