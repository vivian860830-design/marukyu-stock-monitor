name: Marukyu Stock Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Marukyu stock
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: python monitor.py

      - name: Save stock state
        run: |
          if git diff --quiet stock_state.json 2>/dev/null; then
            echo "Stock state unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stock_state.json
          git commit -m "Update stock state"
          git push
