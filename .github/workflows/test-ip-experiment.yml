name: TEMP - two-job IP/session isolation test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  job-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run single-page check
        env:
          MARUKYU_STORAGE_STATE: ${{ secrets.MARUKYU_STORAGE_STATE }}
          JOB_LABEL: job-a
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python test_single_page.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ip-test-job-a
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 1

  job-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `needs: job-a` on purpose — both jobs must run independently in
    # parallel so each gets its own fresh runner VM, not a queued turn on
    # a shared one.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install playwright beautifulsoup4 lxml
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Run single-page check
        env:
          MARUKYU_STORAGE_STATE: ${{ secrets.MARUKYU_STORAGE_STATE }}
          JOB_LABEL: job-b
          PYTHONUNBUFFERED: '1'
        run: xvfb-run -a python test_single_page.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ip-test-job-b
          path: diagnostic-output/
          if-no-files-found: warn
          retention-days: 1
